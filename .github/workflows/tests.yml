name: Badge prototype tests
on:
  push:
    branches: [feature/a4-pdf, feature/editor-controls, feature/multiple-designs, feature/fill-empty-edges, fix/soft-image-edges, feature/compact-workspace-sheet-label, feature/clear-add-image-button]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.mjs
