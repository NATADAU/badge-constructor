name: Badge prototype tests
on:
  push:
    branches: [main, feature/a4-pdf, feature/editor-controls, feature/multiple-designs, feature/fill-empty-edges, fix/soft-image-edges, feature/compact-workspace-sheet-label, feature/clear-add-image-button, feature/project-save-and-sheet-remove, security/file-validation-and-memory-limits]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
